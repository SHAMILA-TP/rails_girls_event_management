# MySQL. Connection settings come from the environment so each teammate (and
# docker-compose) can configure them without editing this file.
#
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: 5
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: rails_girls_event_management_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: rails_girls_event_management_test

# Solid Cache, Solid Queue and Solid Cable each get their own database.
# The DB user needs permission to create them (db:prepare does so on first boot).
production:
  primary:
    <<: *default
    database: rails_girls_event_management_production
  cache:
    <<: *default
    database: rails_girls_event_management_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_girls_event_management_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_girls_event_management_production_cable
    migrations_paths: db/cable_migrate
